name: Android APK
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Publish APK into packages/
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p packages
          cp app/build/outputs/apk/debug/app-debug.apk packages/OfflineAI-debug.apk
          if git diff --quiet -- packages/OfflineAI-debug.apk; then
            echo "APK unchanged; no repository update needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/OfflineAI-debug.apk
          git commit -m "Publish latest debug APK"
          git push
      - name: Upload APK as optional artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
